name: Clear Cache and Rerun Tests

on:
  workflow_dispatch:

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set unique cache-busting key
        id: prep
        run: echo "CACHE_KEY=manual-bust-$(date +%s)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm  # or other cache path
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            manual-bust-

      - name: Install deps and run tests
        run: |
          npm install
          npm test
