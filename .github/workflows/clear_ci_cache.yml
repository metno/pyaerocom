name: Clear Cache and Rerun Tests

on:
  workflow_dispatch:

jobs:
  bust-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set unique cache-busting key
        id: prep
        run: echo "CACHE_KEY=pip-cache-$(date +%s)" >> $GITHUB_ENV

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            pip-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . 

      - name: Run tests
        run: pytest
